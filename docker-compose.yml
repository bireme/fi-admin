services:
  fi_admin:
    container_name: fi-admin
    restart: unless-stopped
    build:
      context: .
      target: prod
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    image: ${IMAGE_TAG}
    expose:
      - 8000
    volumes:
      - ${LOG_PATH}:/logs
      - ${UPLOAD_PATH}:/app/uploads
      - ./proc/:/app/proc/
      - static_files:/app/static_files
    env_file:
      - ./conf/app-env
    environment:
      - PYTHONWARNINGS=ignore:pkg_resources is deprecated:UserWarning
    command: uv run gunicorn --bind 0.0.0.0:8000 fi-admin.wsgi ${GUNICORN_PARAMS}
    networks:
      - nginx-proxy
    deploy:
      resources:
        limits:
          memory: ${MEMORY_APP_LIMIT}
        reservations:
          memory: ${MEMORY_APP_RESERVATION}

  www-static:
    container_name: fi-admin-www-static
    restart: unless-stopped
    image: nginx:1.30-alpine
    expose:
      - 80
    volumes:
      - ./conf/nginx/app:/etc/nginx/conf.d
      - ./conf/nginx/templates:/etc/nginx/templates:ro
      - ./conf/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - static_files:/app/static_files
    depends_on:
      - fi_admin
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${VIRTUAL_HOST}
      # basic auth for staging: only "true" enables it (see conf/nginx/templates)
      - USE_AUTHENTICATION=${USE_AUTHENTICATION:-}
      # render templates outside the bind-mounted conf.d (included from app.conf)
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      # X-Robots-Tag noindex for staging: only "true" enables it (see conf/nginx/templates)
      - BLOCK_ROBOTS=${BLOCK_ROBOTS:-}
    networks:
      - nginx-proxy
    deploy:
      resources:
        limits:
          memory: ${MEMORY_WEBSERVER_LIMIT}
        reservations:
          memory: ${MEMORY_WEBSERVER_RESERVATION}

  www-docs:
    container_name: fi-admin-www-docs
    restart: unless-stopped
    image: nginx:1.30-alpine
    expose:
      - 80
    volumes:
      - ./conf/nginx/docs:/etc/nginx/conf.d
      # only the robots template (the auth template needs USE_AUTHENTICATION, not defined here)
      - ./conf/nginx/templates/robots.conf.template:/etc/nginx/templates/robots.conf.template:ro
      - ${UPLOAD_PATH}:/app/uploads
    depends_on:
      - fi_admin
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST_DOCS}
      - LETSENCRYPT_HOST=${VIRTUAL_HOST_DOCS}
      # X-Robots-Tag noindex for staging: only "true" enables it (see conf/nginx/templates)
      - BLOCK_ROBOTS=${BLOCK_ROBOTS:-}
      # render templates outside the bind-mounted conf.d (included from docs.conf)
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    networks:
      - nginx-proxy
    deploy:
      resources:
        limits:
          memory: ${MEMORY_WEBSERVER_LIMIT}
        reservations:
          memory: ${MEMORY_WEBSERVER_RESERVATION}

  cron:
    container_name: fi-admin-cron
    restart: unless-stopped
    image: ${IMAGE_TAG}
    volumes:
      - ${LOG_PATH}:/logs
    depends_on:
      - fi_admin
    env_file:
      - ./conf/app-env
    environment:
      - PYTHONWARNINGS=ignore:pkg_resources is deprecated:UserWarning
    user: root
    command: crond -f -L /dev/stdout

  fi_admin_cache:
    image: memcached:1.6.32
    container_name: fi-admin-cache
    restart: unless-stopped
    depends_on:
      - fi_admin
    ports:
      - 11211:11211
    environment:
      - MEMCACHED_CACHE_SIZE=128
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true

volumes:
  static_files:
