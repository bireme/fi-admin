{% load i18n %}

{% if reference_list %}
    <ul class="dashboard-list">
        {% for ref in reference_list %}
            <li><a class="dashboard-list-title" href="/log/review/{{review_type}}/{{ref.content_type_id}}/{{ref.object_id}}/">{{ ref.object_repr }}</a></li>
        {% endfor %}
    </ul>
{% else %}
    <p class="dashboard-empty">{% trans "No records found" %}</p>
{% endif %}
