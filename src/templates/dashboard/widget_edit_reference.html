{% load i18n %}

{% if reference_list %}
    <ul class="dashboard-list">
        {% for reference in reference_list %}
            <li><a class="dashboard-list-title" href="{% url 'edit_biblioref_analytic' reference.id %}">{{ reference }}</a></li>
        {% endfor %}
    </ul>
{% else %}
    <p class="dashboard-empty">{% trans "No records found" %}</p>
{% endif %}
