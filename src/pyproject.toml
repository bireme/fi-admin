[project]
name = "fi-admin"
version = "0"  # not used: the app version comes from APP_VERSION (git describe)
requires-python = "==3.14.*"  # matches Dockerfile PYTHON_VERSION
dependencies = [
    "Django~=5.2.18",
    "mysqlclient~=2.2.8",
    "gunicorn~=26.0.0",
    "django-rosetta~=0.10.3",
    "django-tastypie~=0.15.1",
    "django-haystack~=3.4.0",
    "requests~=2.34.2",
    "pysolr~=3.11.0",
    "lxml~=6.1.3",
    "defusedxml~=0.7.1",
    "cssselect~=1.4.0",
    "simplejson~=4.1.1",
    "deform~=3.0.1",
    "jsonfield~=3.2.0",
    "short-url~=1.2.2",
    "django-tinymce~=5.0.0",
    "colander~=2.0.0",
    "django-multiselectfield~=1.0.1",
    "pymemcache~=4.0.0",
    "django-crum~=0.7.9",
    "elastic-apm~=6.26.2",
    # deform 3.0.1, utils/views.py and oer/views.py import pkg_resources, removed in setuptools 81
    "setuptools<81",
]

[dependency-groups]
dev = [
    "model-bakery~=1.24.2",
    "requests_mock~=1.12.1",
    "django-debug-toolbar~=5.2.0",
    "coverage~=7.15.2",
]

[tool.uv]
package = false
