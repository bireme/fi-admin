services:
  fi_admin_api:
    container_name: fi-admin-api
    restart: unless-stopped
    build:
      context: .
      target: prod
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    image: ${IMAGE_TAG}
    depends_on:
      - fi_admin_api_cache
    volumes:
      - ${LOG_PATH}:/logs
      - static_files:/app/static_files
      - gunisock:/tmp
    env_file:
      - ./conf/app-env-api
    command: gunicorn --bind unix:/tmp/gunicorn.sock fi-admin.wsgi ${GUNICORN_PARAMS}
    networks:
      - nginx-proxy
    deploy:
      resources:
        limits:
          memory: ${MEMORY_APP_LIMIT}
        reservations:
          memory: ${MEMORY_APP_RESERVATION}

  webserver:
    container_name: fi-admin-api-webserver
    restart: unless-stopped
    image: nginx:1.18-alpine
    expose:
      - 80
    volumes:
      - ./conf/nginx/api:/etc/nginx/conf.d
      - static_files:/app/static_files
      - gunisock:/tmp
    depends_on:
      - fi_admin_api
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    networks:
      - nginx-proxy
    deploy:
      resources:
        limits:
          memory: ${MEMORY_WEBSERVER_LIMIT}
        reservations:
          memory: ${MEMORY_WEBSERVER_RESERVATION}

  fi_admin_api_cache:
    container_name: fi-admin-api-cache
    restart: unless-stopped
    image: memcached:1.6.32
    environment:
      - MEMCACHED_CACHE_SIZE=128
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true

volumes:
  static_files:
  gunisock:
