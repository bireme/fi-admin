# Shared main nginx config for the fi-admin webservers (mounted at /etc/nginx/nginx.conf
# by docker-compose.yml and docker-compose-api.yml).
# Based on the nginx:1.30-alpine default, tuned to avoid
# "accept4() failed (24: No file descriptors available)".
# Keep this file outside conf/nginx/{api,app,docs}/ (mounted as conf.d, included inside http {}).

user  nginx;
worker_processes  auto;

# per-worker open files limit (container ulimit nofile must be >= this value)
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    # each proxied request uses ~2 fds (client + upstream)
    worker_connections  16384;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    # disable nginx version signature
    server_tokens off;

    # release idle and slow client connections sooner
    keepalive_timeout      15s;
    client_header_timeout  30s;
    client_body_timeout    30s;
    reset_timedout_connection on;

    include /etc/nginx/conf.d/*.conf;
}
