upstream fi_admin{
    server fi_admin:8000;
}

server {
    listen 80;

    # disable nginx version signature
    server_tokens off;

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), midi=(), sync-xhr=(), microphone=(), camera=(), magnetometer=(), gyroscope=(), fullscreen=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-src 'self' https: data:; media-src 'self' https: data:; connect-src 'self' https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; font-src 'self' https: data:; upgrade-insecure-requests;" always;

    location / {
        proxy_pass http://fi_admin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_redirect off;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Strict";
        send_timeout 600;

        # allow upload files
        client_max_body_size 100m;
    }

    location /static/ {
        alias /app/static_files/;
    }

    # redirect direct calls to fi-admin-api domain
    location /api/ {
        rewrite ^/api/(.*)$ https://fi-admin-api.bvsalud.org/api/$1 redirect;
    }

    # enable compression
    gzip             on;
    gzip_comp_level  2;
    gzip_min_length  1000;
    gzip_proxied     expired no-cache no-store private auth;
    gzip_types       text/plain application/x-javascript text/xml text/css application/xml;

}